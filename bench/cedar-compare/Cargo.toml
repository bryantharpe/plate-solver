[package]
name = "cedar-compare"
version = "0.0.0"
edition = "2021"
publish = false
description = "Times the Rust pipeline against cedar-detect + cedar-solve on the same frames"

# Outside the product workspace (see `exclude` in the root Cargo.toml): this harness pulls
# in the vendored cedar-detect, which is a reference oracle and not part of the product.
# The empty table makes this directory its own workspace root, so cargo stops here even
# when the checkout sits inside another one (e.g. a git worktree under .claude/worktrees/).
# Cargo.lock is committed so `run.sh` builds with --locked.
[workspace]

[dependencies]
plate-solver = { path = "../../crates/plate-solver" }
star-detection = { path = "../../crates/star-detection" }
pattern-database = { path = "../../crates/pattern-database" }
cedar_detect = { path = "../../reference-solutions/cedar-detect" }
image = { version = "0.25.1", default-features = false, features = ["jpeg", "png", "pnm"] }
serde_json = "1.0"
